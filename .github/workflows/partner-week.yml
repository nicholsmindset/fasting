name: Partner week on Android
on:
  pull_request:
    paths:
      - 'app/src/**/partner/**'
      - 'app/src/main/res/values/*partner*'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle.kts'
      - 'server/partner-week/**'
      - 'scripts/partner-week-qa/**'
      - 'scripts/partner-week-journey.py'
      - '.github/workflows/partner-week.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: partner-week-${{ github.ref }}
  cancel-in-progress: true

jobs:
  two-emulators:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PGHOST: 127.0.0.1
      PGPORT: 18479
      PGPASSWORD: local-fixture
      PGUSER: postgres
      PGDATABASE: postgres
      TEST_JWT_SECRET: partner-week-disposable-runner-credential
    services:
      db:
        image: postgres:16
        ports: ['18479:5432']
        env:
          POSTGRES_PASSWORD: local-fixture
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 3s --health-retries 25
      rest:
        image: postgrest/postgrest:v12.2.3
        ports: ['18480:3000']
        env:
          PGRST_DB_URI: postgres://postgres:local-fixture@db:5432/postgres
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: anon
          PGRST_JWT_SECRET: partner-week-disposable-runner-credential
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Prepare the disposable partner database and app certificates
        run: |
          command -v nginx || (sudo apt-get update -qq && sudo apt-get install -y nginx)
          bash scripts/partner-week-qa/start-backend.sh
      - name: Build two independent app installations
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleStaging -Pfastingshift.partnerEndpoint=https://127.0.0.1:18443/
      - name: Prepare Android UI automation
        run: |
          python -m pip install 'uiautomator2==3.3.2' 'zxing-cpp==2.3.0'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise Partner Week on two emulators across the date line
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          ram-size: 1536M
          cores: 2
          script: bash scripts/partner-week-qa/two-emulators.sh
      - name: Save the two partner views and weekly recap
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partner-week-android-screens
          path: partner-week-evidence/*.png
          if-no-files-found: ignore
