name: Challenge invite page
on:
  pull_request:
    paths:
      - 'web/**'
      - 'tests/invite.test.mjs'
      - '.github/workflows/invite-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test tests/invite.test.mjs
      - name: Check the mobile invitation and installation fallback in Chromium
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/invite-preview"
          mkdir -p "$root/fasting"
          cp -R web/c "$root/fasting/"
          python3 -m http.server 8077 --bind 127.0.0.1 --directory "$root" >"$RUNNER_TEMP/invite-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8077/fasting/c/ >/dev/null; then break; fi
            sleep 0.25
          done
          fixture="$(node -p "Buffer.from('1|D|window_16_8|20261124|7|A week with friends').toString('base64url')")"
          origin=http://127.0.0.1:8077
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then origin=https://nicholsmindset.github.io; fi
          probe() {
            google-chrome --headless --no-sandbox --disable-dev-shm-usage --virtual-time-budget=3000 \
              --user-agent="Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/140.0.0.0 Mobile Safari/537.36" \
              --window-size=393,852 --dump-dom "$1" >"$RUNNER_TEMP/invite-dom.html"
          }
          probe "$origin/fasting/c/#$fixture"
          python3 - "$RUNNER_TEMP/invite-dom.html" "$fixture" <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys

          class Elements(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.by_id = {}
              def handle_starttag(self, tag, attrs):
                  attr = dict(attrs)
                  if 'id' in attr:
                      self.by_id[attr['id']] = attr

          page = Path(sys.argv[1]).read_text()
          elements = Elements()
          elements.feed(page)
          for key in ('invitation', 'install-help', 'android-actions'):
              assert 'hidden' not in elements.by_id[key], key
          assert 'A week with friends</h1>' in page
          assert '16:8 daily fast</dd>' in page
          assert '7 days</dd>' in page
          href = elements.by_id['open-app']['href']
          assert href.startswith('intent://fastingshift.com/c/' + sys.argv[2] + '#Intent;')
          assert 'package=com.fastingshift.app.staging;' in href
          PY
          probe "$origin/fasting/c/#bad"
          grep -q 'This invite link is incomplete or invalid</h1>' "$RUNNER_TEMP/invite-dom.html"
