name: Verify backup transfer between staging APKs
on:
  push:
    branches: [codex/staging-apk-compatibility-nov25]
permissions:
  actions: read
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 714b8a76c46d1ac1a37d8dae90f3498b0649e91c
          path: previous-code
          sparse-checkout: app/src/main/res/values
          persist-credentials: false
      - name: Fetch historical APKs by artifact ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pair in "previous:14939255464" "redesign:14954214093"; do
            folder="${pair%%:*}"
            artifact="${pair#*:}"
            mkdir "$folder"
            curl --fail --silent --show-error --location --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Cache-Control: no-cache" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip?nonce=$GITHUB_RUN_ID" -o "$folder.zip"
            if unzip -Z1 "$folder.zip" AndroidManifest.xml > /dev/null 2>&1; then mv "$folder.zip" "$folder/app-staging.apk"; else unzip -q "$folder.zip" -d "$folder"; fi
          done
      - name: Inspect the release manifests and public signers
        shell: bash
        run: |
          set -euo pipefail
          buildtools=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)
          for version in previous redesign; do
            mapfile -t apks < <(find "$version" -type f -name '*.apk')
            test "${#apks[@]}" -eq 1
            echo "$version"
            "$buildtools/aapt" dump badging "${apks[0]}" > "$version.manifest"
            head -n1 "$version.manifest"
            "$buildtools/apksigner" verify --print-certs "${apks[0]}" > "$version.signers"
            grep -F 'certificate SHA-256 digest:' "$version.signers" | tee "$version.sha256"
          done
          if cmp -s previous.sha256 redesign.sha256; then echo "STAGING_SIGNER_MATCH"; else echo "STAGING_SIGNER_DIFFERENT"; fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare disposable test phone
        run: |
          python -m pip install 'uiautomator2==3.3.2'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Save and restore real tester files on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python -u scripts/check-staging-transfer.py
