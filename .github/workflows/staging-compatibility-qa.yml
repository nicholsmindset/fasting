name: Compare downloadable staging APKs
on:
  push:
    branches: [codex/staging-apk-compatibility-nov25]
permissions:
  actions: read
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch historical APKs by artifact ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pair in "previous:14939255464" "redesign:14954214093"; do
            folder="${pair%%:*}"
            artifact="${pair#*:}"
            mkdir "$folder"
            curl --fail --silent --show-error --location --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Cache-Control: no-cache" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip?nonce=$GITHUB_RUN_ID" -o "$folder.zip"
            unzip -q "$folder.zip" -d "$folder"
          done
      - name: Inspect the release manifests and public signers
        shell: bash
        run: |
          set -euo pipefail
          buildtools=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)
          for version in previous redesign; do
            mapfile -t apks < <(find "$version" -type f -name '*.apk')
            test "${#apks[@]}" -eq 1
            echo "$version"
            "$buildtools/aapt" dump badging "${apks[0]}" > "$version.manifest"
            head -n1 "$version.manifest"
            "$buildtools/apksigner" verify --print-certs "${apks[0]}" > "$version.signers"
            grep -F 'certificate SHA-256 digest:' "$version.signers" | tee "$version.sha256"
          done
          if cmp -s previous.sha256 redesign.sha256; then echo "STAGING_SIGNER_MATCH"; else echo "STAGING_SIGNER_DIFFERENT"; fi
