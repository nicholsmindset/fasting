name: Internal beta APK

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build unsigned beta
        env:
          FS_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleInternalBeta
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-beta-input
          path: app/build/outputs/apk/internalBeta/*-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: internal-beta
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-beta-input
          path: input
      - uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;36.0.0"
      - name: Verify and sign tester build
        env:
          BETA_KEYSTORE_BASE64: ${{ secrets.BETA_KEYSTORE_BASE64 }}
          BETA_KEY_ALIAS: ${{ secrets.BETA_KEY_ALIAS }}
          BETA_STORE_PASSWORD: ${{ secrets.BETA_STORE_PASSWORD }}
          BETA_KEY_PASSWORD: ${{ secrets.BETA_KEY_PASSWORD }}
          BETA_CERT_SHA256: ${{ vars.BETA_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          export BETA_KEYSTORE="$RUNNER_TEMP/internal-beta.jks"
          trap 'rm -f "$BETA_KEYSTORE"' EXIT
          printf '%s' "${BETA_KEYSTORE_BASE64:?Configure the internal-beta signing key}" | base64 --decode > "$BETA_KEYSTORE"
          unset BETA_KEYSTORE_BASE64
          bash scripts/sign-internal-beta.sh input/*-unsigned.apk dist/fasting-shift-beta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fasting-shift-internal-beta
          path: dist/fasting-shift-beta.apk
          if-no-files-found: error
