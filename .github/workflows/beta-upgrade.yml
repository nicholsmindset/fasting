name: Beta upgrade smoke test
on: pull_request

permissions:
  contents: read

concurrency:
  group: beta-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: previous
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and sign both versions with one disposable key
        env:
          BETA_KEY_ALIAS: upgrade-test
          BETA_STORE_PASSWORD: emulator-only
          BETA_KEY_PASSWORD: emulator-only
        run: |
          set -euo pipefail
          export BETA_KEYSTORE="$RUNNER_TEMP/upgrade-test.p12"
          trap 'rm -f "$BETA_KEYSTORE"' EXIT
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$BETA_KEYSTORE" \
            -storepass:env BETA_STORE_PASSWORD -keypass:env BETA_KEY_PASSWORD -alias "$BETA_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Emulator upgrade test'
          export BETA_CERT_SHA256="$(keytool -exportcert -keystore "$BETA_KEYSTORE" -alias "$BETA_KEY_ALIAS" -storepass:env BETA_STORE_PASSWORD | sha256sum | cut -d' ' -f1)"
          if ! grep -q 'create("internalBeta")' previous/app/build.gradle.kts; then
            # Older revisions predate beta distribution. Add the packaging variant only.
            cat >> previous/app/build.gradle.kts <<'KOTLIN'

          android.buildTypes.create("internalBeta") {
              initWith(android.buildTypes.getByName("release"))
              signingConfig = null
              applicationIdSuffix = ".beta"
              versionNameSuffix = "-beta"
              matchingFallbacks += listOf("release")
          }
          KOTLIN
          fi
          (cd previous && ./gradlew :app:assembleInternalBeta -Pfastingshift.versionCode=100)
          bash scripts/sign-internal-beta.sh previous/app/build/outputs/apk/internalBeta/*-unsigned.apk "$RUNNER_TEMP/beta-before.apk"
          rm -rf previous/app/build previous/core/data/build previous/core/domain/build
          ./gradlew :app:assembleInternalBeta -Pfastingshift.versionCode=101
          bash scripts/sign-internal-beta.sh app/build/outputs/apk/internalBeta/*-unsigned.apk "$RUNNER_TEMP/beta-after.apk"
          ./gradlew --stop
          rm -rf app/build core/data/build core/domain/build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install UI driver and enable KVM
        run: |
          python -m pip install 'uiautomator2==3.3.2'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create fasts, update and verify both records
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python scripts/beta-upgrade-smoke.py "$RUNNER_TEMP/beta-before.apk" "$RUNNER_TEMP/beta-after.apk"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: beta-upgrade-diagnostics
          path: upgrade-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
