name: Android 8 timer and history
on:
  pull_request:
    paths:
      - 'app/src/main/kotlin/com/fastingshift/app/alarm/**'
      - 'app/src/main/kotlin/com/fastingshift/app/ui/timer/**'
      - 'core/domain/src/main/kotlin/com/fastingshift/domain/timer/**'
      - 'core/domain/src/main/kotlin/com/fastingshift/domain/reminders/**'
      - 'scripts/beta-upgrade-smoke.py'
      - '.github/workflows/android-8-staging-smoke.yml'
      - 'scripts/android-8-staging-smoke.py'
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build staging
        run: ./gradlew :app:assembleStaging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the UI driver and emulator
        run: |
          python -m pip install 'uiautomator2==3.3.2'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify onboarding, timer and saved history
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python -u scripts/android-8-staging-smoke.py app/build/outputs/apk/staging/app-staging.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-8-staging-smoke
          path: api26-proof/
          if-no-files-found: warn
