name: Android 8 distributed staging smoke
on:
  push:
    branches: ['qa/android-8-staging-smoke']
    paths:
      - '.github/workflows/android-8-staging-smoke.yml'
      - 'scripts/android-8-staging-smoke.py'
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch and verify the previously distributed staging APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/nicholsmindset/fasting/actions/artifacts/15078685176/zip > distributed-staging.apk
          echo 'a8e4ad8988c116784e3e3a2dcbd93eb4956948b32ba32ab1d77936ee89c1479a  distributed-staging.apk' | sha256sum -c -
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the UI driver and emulator
        run: |
          python -m pip install 'uiautomator2==3.3.2'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify onboarding, timer and saved history
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python -u scripts/android-8-staging-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-8-staging-smoke
          path: api26-proof/
          if-no-files-found: warn
