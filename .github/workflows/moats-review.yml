name: Inspect synthetic screenshot assertion
on:
  push:
    branches: [codex/moats-capture-review]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reports
          github-token: ${{ github.token }}
          run-id: 45177706090
          path: reports
      - shell: python
        run: |
          from pathlib import Path
          from html import unescape
          import re
          for p in Path('reports').rglob('*MoatsCaptureTest*.html'):
              s = p.read_text()
              for block in re.findall(r'<pre[^>]*>(.*?)</pre>', s, re.S):
                  text = unescape(re.sub('<[^>]*>', '', block))
                  print(text[:4200])
