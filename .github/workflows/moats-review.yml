name: Inspect My Week captures
on:
  push:
    branches: [codex/moats-capture-review]
permissions:
  actions: read
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fasting-shift-moats-screens
          github-token: ${{ github.token }}
          run-id: 45192230204
          path: screens
      - name: Render synthetic planner captures
        run: |
          python -c 'import PIL' || python -m pip install Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import io, base64
          imgs=[]
          for name in ('my-week','my-week-one-day'):
              im=Image.open(Path('screens/en') / (name+'.png')).convert('RGB')
              im.thumbnail((390,820))
              imgs.append(im)
          out=Image.new('RGB',(sum(im.width for im in imgs),max(im.height for im in imgs)),'white')
          out.paste(imgs[0],(0,0));out.paste(imgs[1],(imgs[0].width,0))
          buffer=io.BytesIO();out.save(buffer,'JPEG',quality=81)
          data=buffer.getvalue()
          for i in range(0,len(data),1800):
              print('WKPIX|'+base64.b64encode(data[i:i+1800]).decode())
          PY
