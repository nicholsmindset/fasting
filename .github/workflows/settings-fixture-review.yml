name: Verify native staging package
on:
  push:
    branches: [codex/settings-review-fixtures]
permissions:
  actions: read
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check package integrity and Android signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_apk() {
            local id="$1" dest="$2"
            curl --retry 3 -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$dest"
          }
          fetch_apk 14977909745 previous.apk
          fetch_apk 14980499375 current.apk
          echo '3ee65aa81531032d0de40abcaf9c4e156b65c9699e4351016b7c67eafd6aac5f  previous.apk' | sha256sum -c -
          echo '96d05467cb907b21d1b6e2052cd2ce560be765f279bb609e076a671ea4687a9a  current.apk' | sha256sum -c -
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for file in previous.apk current.apk; do
            unzip -tqq "$file"
            unzip -Z1 "$file" | awk '$0 == "AndroidManifest.xml" || $0 == "classes.dex"'
            echo "Verifying signer of $file"
            "$signer" verify --print-certs "$file" | grep 'certificate SHA-256 digest'
          done
          sha256sum previous.apk current.apk
