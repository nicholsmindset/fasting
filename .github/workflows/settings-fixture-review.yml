name: Locate failed Android capture
on:
  push:
    branches: [codex/settings-review-fixtures]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45518596771
          name: reports
          path: reports
      - name: Show failure location for appearance capture
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          for f in Path('reports').rglob('*MoatsCaptureTest.xml'):
              for t in ET.parse(f).getroot().iter('testcase'):
                  e=t.find('failure')
                  if e is not None and t.get('name','').startswith('chooseLightOnADarkDevice'):
                      print('Failure:', e.get('message'))
                      for line in (e.text or '').splitlines():
                          if 'com.fastingshift.app.MoatsCaptureTest.' in line:
                              print(line)
          PY
