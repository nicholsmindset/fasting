name: Locate failed Android capture
on:
  push:
    branches: [codex/settings-review-fixtures]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45518596771
          name: reports
          path: reports
      - name: Show failure location for appearance capture
        run: |
          python - <<'PY'
          from pathlib import Path
          from html import unescape
          found = False
          for f in Path('reports').rglob('*.html'):
              if 'MoatsCaptureTest' not in str(f): continue
              s = unescape(f.read_text())
              if 'ComposeTimeoutException' not in s: continue
              found = True
              import re
              for a in re.findall(r'at com\.fastingshift\.app\.MoatsCaptureTest\.[^<\n]+?\.kt:\d+\)',s): print('Capture frame:',a)
          assert found, 'Missing HTML failure report'
          PY
