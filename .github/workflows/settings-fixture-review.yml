name: Review dated History records
on:
  push:
    branches: [codex/settings-review-fixtures]
permissions:
  actions: read
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      matrix:
        screen: [history-records-chart, history-records-dates]
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45523191506
          name: fasting-shift-moats-screens
          path: captured
      - name: Read synthetic screenshots
        env:
          SCREEN: ${{ matrix.screen }}
        run: |
          python -c 'import PIL' || python -m pip install Pillow
          python - <<'PY'
          import base64, hashlib, io, os
          from PIL import Image
          from pathlib import Path
          for key in (os.environ["SCREEN"],):
              with Image.open(Path("captured/en") / (key + ".png")) as im:
                  im = im.convert("RGB")
                  im.thumbnail((600, 1200), Image.Resampling.LANCZOS)
                  out = io.BytesIO()
                  im.save(out, format="JPEG", quality=92, optimize=True, subsampling=0)
              raw = out.getvalue()
              print(f"FSQA|BEGIN|{key}|{len(raw)}|{hashlib.sha256(raw).hexdigest()}")
              for offset in range(0, len(raw), 1800):
                  print(f"FSQA|PART|{key}|{offset//1800}|{base64.b64encode(raw[offset:offset+1800]).decode()}")
              print(f"FSQA|END|{key}")
          PY
