name: Inspect emulator choice semantics
on:
  push:
    branches: [codex/settings-review-fixtures]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect matching nodes in generated emulator hierarchy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --retry 3 -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/14981737219/zip" -o diag.zip
          python - <<'PY'
          from zipfile import ZipFile
          from xml.etree import ElementTree as ET
          import json
          with ZipFile('diag.zip') as z:
              files=[n for n in z.namelist() if n.endswith('screen.xml')]
              print('Matching XML files:',len(files))
              for file in files:
                  tree=ET.fromstring(z.read(file)); print('Node count:',sum(1 for n in tree.iter('node')))
                  keys=['text','content-desc','resource-id','class','clickable','enabled','scrollable','bounds']
                  for n in tree.iter('node'):
                      label=(n.get('text','')+' '+n.get('content-desc','')).lower()
                      if 'partly' in label or 'did this schedule fit your week' in label or 'change answer' in label:
                          print('MATCH:',json.dumps(n.attrib))
          PY
