name: Inspect Fasting Shift layouts
on:
  push:
    branches:
      - codex/fasting-layout-proof
permissions:
  contents: read
  actions: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45433761871
          name: reports
          path: captured
      - name: Report failed UI assertions
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          from html import unescape
          import re
          for path in sorted(Path("captured").rglob("*.html")):
              if not any(name in path.name for name in ["TimerFlowTest", "MuslimHubScreenTest"]):
                  continue
              html = path.read_text()
              print("FSREPORT", path.name)
              for raw in re.findall(r"<pre[^>]*>(.*?)</pre>", html, re.S):
                  s = unescape(re.sub(r"<[^>]*>", "", raw))
                  if "DBG>>" in s:
                      lines = [l for l in s.splitlines() if "text" in l.lower() or "description" in l.lower()]
                      print("FSSEMANTICS", "\n".join(lines[-42:])[:4200])
                  else:
                      print("FSERROR", s[:2600])
          PYCODE
