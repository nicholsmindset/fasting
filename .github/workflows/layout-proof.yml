name: Inspect Fasting Shift layouts
on:
  push:
    branches:
      - codex/fasting-layout-proof
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: 5372d1547f12d4d26ef175d5eaf554bae2e845d4
          path: review-app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-runtime-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Capture the running timer at 200 percent text
        env:
          JAVA_TOOL_OPTIONS: -Drobolectric.dependency.repo.url=https://maven-central.storage-download.googleapis.com/maven2
        working-directory: review-app
        run: ./gradlew :app:testDebugUnitTest -Pscreenshots --tests '*.MoatsCaptureTest.changeTimerViewAtDoubleFontSize'
      - name: Inspect the 320dp timer with 200 percent text
        run: |
          python -c 'import PIL' || python -m pip install Pillow
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import base64, io
          from PIL import Image
          for key in ('large-text',):
              path = Path('review-app/app/build/moats-captures/en/timer-large-text.png')
              with Image.open(path) as src:
                  assert src.format == 'PNG' and src.width >= 320 and src.height > src.width
                  im = src.convert('RGB')
                  im.thumbnail((500, 1100), Image.Resampling.LANCZOS)
                  out = io.BytesIO()
                  im.save(out, format='JPEG', quality=92, optimize=True, subsampling=0)
              raw = out.getvalue()
              print('FSREVIEW|BEGIN|' + key + '|' + str(len(raw)) + '|' + sha256(raw).hexdigest())
              for i in range(0, len(raw), 1800):
                  print('FSREVIEW|PART|' + key + '|' + str(i//1800) + '|' + base64.b64encode(raw[i:i+1800]).decode('ascii'))
              print('FSREVIEW|END|' + key)
          PY
