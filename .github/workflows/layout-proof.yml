name: Inspect Fasting Shift layouts
on:
  push:
    branches: [codex/fasting-layout-proof]
permissions:
  actions: read
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45462458723
          name: fasting-shift-moats-screens
          path: captured
      - name: Read the two weekly review fixtures
        run: |
          python -c 'import PIL' || python -m pip install Pillow
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import base64, io
          from PIL import Image
          for key in ('example', 'personal', 'reminders'):
              path = (Path('captured/settings/4a-reminders-light.png') if key == 'reminders' else
                      Path('captured/en/schedule-review-' + key + '.png'))
              with Image.open(path) as src:
                  assert src.format == 'PNG' and src.width >= 411 and src.height > src.width
                  im = src.convert('RGB')
                  im.thumbnail((460, 920), Image.Resampling.LANCZOS)
                  out = io.BytesIO()
                  im.save(out, format='JPEG', quality=92, optimize=True, subsampling=0)
              raw = out.getvalue()
              print('FSREVIEW|BEGIN|' + key + '|' + str(len(raw)) + '|' + sha256(raw).hexdigest())
              for i in range(0, len(raw), 1800):
                  print('FSREVIEW|PART|' + key + '|' + str(i//1800) + '|' + base64.b64encode(raw[i:i+1800]).decode('ascii'))
              print('FSREVIEW|END|' + key)
          PY
