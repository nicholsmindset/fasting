name: Android CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Domain tests
        run: ./gradlew :core:domain:test

      - name: Android unit tests
        run: ./gradlew :core:data:testDebugUnitTest :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Lint and build the staging preview
        if: github.event_name == 'pull_request'
        run: |
          ./gradlew :app:lintDebug :app:assembleStaging
          ./gradlew :app:testDebugUnitTest --tests '*.StoreScreenshotTest' -Pscreenshots

      - uses: actions/upload-artifact@v4
        if: success() && github.event_name == 'pull_request'
        with:
          name: fasting-shift-history-preview
          path: |
            app/build/outputs/apk/staging/*.apk
            docs/screenshots/2*.png
          if-no-files-found: error

      - name: Verify beta signing with the disposable CI key
        if: github.event_name == 'pull_request'
        env:
          BETA_KEY_ALIAS: androiddebugkey
          BETA_STORE_PASSWORD: android
          BETA_KEY_PASSWORD: android
        run: |
          set -euo pipefail
          ./gradlew :app:assembleInternalBeta
          export BETA_KEYSTORE="$HOME/.android/debug.keystore"
          export BETA_CERT_SHA256="$(keytool -exportcert -keystore "$BETA_KEYSTORE" -alias "$BETA_KEY_ALIAS" -storepass "$BETA_STORE_PASSWORD" | sha256sum | cut -d' ' -f1)"
          bash scripts/sign-internal-beta.sh app/build/outputs/apk/internalBeta/*-unsigned.apk "$RUNNER_TEMP/test-beta.apk"
          if BETA_CERT_SHA256=invalid bash scripts/sign-internal-beta.sh app/build/outputs/apk/internalBeta/*-unsigned.apk "$RUNNER_TEMP/mismatch.apk"; then exit 1; fi
          test ! -e "$RUNNER_TEMP/mismatch.apk"

      - name: Check Room schema is committed
        run: |
          if [[ -n "$(git status --porcelain -- core/data/schemas)" ]]; then
            git status --short -- core/data/schemas
            echo "Commit the current generated Room schema."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/tests/
            app/build/outputs/apk/debug/*.apk
            core/data/schemas/
          if-no-files-found: ignore
