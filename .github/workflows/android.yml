name: Android CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36"

      - uses: gradle/actions/setup-gradle@v4

      - name: Domain tests
        run: ./gradlew :core:domain:test

      - name: Android unit tests
        run: ./gradlew :core:data:testDebugUnitTest :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Lint and build the staging preview
        if: github.event_name == 'pull_request'
        run: |
          ./gradlew :app:lintDebug :app:assembleStaging
          ./gradlew :app:testDebugUnitTest --tests '*.StoreScreenshotTest' -Pscreenshots

      - uses: actions/upload-artifact@v4
        if: success() && github.event_name == 'pull_request'
        with:
          name: fasting-shift-history-preview
          path: |
            app/build/outputs/apk/staging/*.apk
            docs/screenshots/2*.png
          if-no-files-found: error

      - name: Check Room schema is committed
        run: |
          git diff --exit-code -- core/data/schemas || (echo "Room schema changed: commit core/data/schemas" && exit 1)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/tests/
            app/build/outputs/apk/debug/*.apk
            core/data/schemas/
          if-no-files-found: ignore
