name: Publish to Play internal testing

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: New Play version code (higher than every code already uploaded)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fasting-shift-play-internal
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: play-internal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      FS_VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check the requested version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FS_VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] && (( FS_VERSION_CODE <= 2100000000 )) || {
            echo "::error::Enter a version code between 1 and 2100000000."
            exit 1
          }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Build the release bundle and verify the Play upload certificate
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          FS_UPLOAD_STORE_PASSWORD: ${{ secrets.FS_UPLOAD_STORE_PASSWORD }}
          FS_UPLOAD_KEY_ALIAS: ${{ secrets.FS_UPLOAD_KEY_ALIAS }}
          FS_UPLOAD_KEY_PASSWORD: ${{ secrets.FS_UPLOAD_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ vars.PLAY_UPLOAD_CERT_SHA256 }}
          REVENUECAT_KEY: ${{ vars.REVENUECAT_ANDROID_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          umask 077
          : "${KEYSTORE_BASE64:?Missing upload keystore}" "${FS_UPLOAD_STORE_PASSWORD:?Missing store password}"
          : "${FS_UPLOAD_KEY_ALIAS:?Missing key alias}" "${FS_UPLOAD_KEY_PASSWORD:?Missing key password}"
          export FS_UPLOAD_STORE_FILE="$RUNNER_TEMP/play-upload.jks"
          trap 'rm -f "$FS_UPLOAD_STORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$FS_UPLOAD_STORE_FILE"
          unset KEYSTORE_BASE64
          ./gradlew --no-daemon :app:bundleRelease "-Prevenuecat.apiKey=$REVENUECAT_KEY"
          bundle=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$bundle"
          expected=$(printf '%s' "$EXPECTED_CERT" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          actual=$(keytool -printcert -rfc -jarfile "$bundle" | openssl x509 -outform DER | sha256sum | cut -d' ' -f1)
          [[ "$expected" =~ ^[0-9a-f]{64}$ && "$actual" == "$expected" ]] || {
            echo "::error::The signed bundle must match the Play Console upload certificate."
            exit 1
          }
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Publish this bundle to internal testers
        shell: bash
        env:
          PLAY_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          package=com.fastingshift.app
          api=https://androidpublisher.googleapis.com
          path="androidpublisher/v3/applications/$package/edits"
          bundle=app/build/outputs/bundle/release/app-release.aab
          release_name="Fasting Shift $FS_VERSION_CODE ($GITHUB_SHA)"
          request() { curl --fail-with-body --silent --show-error --connect-timeout 20 --max-time 300 -H "Authorization: Bearer $PLAY_TOKEN" "$@"; }
          edit=$(request -X POST -H 'Content-Type: application/json' -d '{}' "$api/$path" | jq -er '.id')
          edit_url="$api/$path/$edit"
          # Only a successful commit publishes changes. Discard any outstanding edit on failure.
          trap 'if [[ -n "$edit" ]]; then request -X DELETE "$edit_url" >/dev/null || true; fi' EXIT
          track_url="$edit_url/tracks/qa"
          track=$(request "$track_url")
          if jq -e --arg code "$FS_VERSION_CODE" --arg name "$release_name" \
            'any(.releases[]?; .status == "completed" and .name == $name and .versionCodes == [$code])' <<< "$track" >/dev/null; then
            echo "Version $FS_VERSION_CODE from this commit is already on internal testing."
            exit 0
          fi
          if ! jq -e 'all(.releases[]?; .status == "completed")' <<< "$track" >/dev/null; then
            echo "::error::Resolve the pending internal release in Play Console first."
            exit 1
          fi
          tracks=$(request "$edit_url/tracks")
          highest=$(jq -r '[.tracks[]?.releases[]?.versionCodes[]? | tonumber] | max // 0' <<< "$tracks")
          if (( FS_VERSION_CODE <= highest )); then
            echo "::error::Version code $FS_VERSION_CODE must be above the highest code on a track ($highest)."
            exit 1
          fi
          uploaded=$(request -X POST -H 'Content-Type: application/octet-stream' --data-binary "@$bundle" \
            "$api/upload/$path/$edit/bundles?uploadType=media")
          digest=$(sha256sum "$bundle" | cut -d' ' -f1)
          jq -e --argjson code "$FS_VERSION_CODE" --arg digest "$digest" \
            '.versionCode == $code and .sha256 == $digest' <<< "$uploaded" >/dev/null
          release=$(jq -n --arg v "$FS_VERSION_CODE" --arg name "$release_name" \
            '{releases: [{name: $name, versionCodes: [$v], status: "completed"}]}')
          request -X PUT -H 'Content-Type: application/json' -d "$release" "$track_url" >/dev/null
          request -X POST -d '' "$edit_url:commit" >/dev/null
          edit=
          echo "Published version $FS_VERSION_CODE to Play internal testing." >> "$GITHUB_STEP_SUMMARY"
