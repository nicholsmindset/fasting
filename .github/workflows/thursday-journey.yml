name: Thursday schedule journey
on:
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - '.github/workflows/thursday-journey.yml'
permissions:
  contents: read
concurrency:
  group: thursday-journey-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  compare:
    name: Capture ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Apply identical test to unchanged base
        if: matrix.variant == 'before'
        run: |
          test_file=app/src/test/kotlin/com/fastingshift/app/ThursdayJourneyScreenshotTest.kt
          cp "$test_file" "$RUNNER_TEMP/ThursdayJourneyScreenshotTest.kt"
      - uses: actions/checkout@v4
        if: matrix.variant == 'before'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Restore comparison fixture
        if: matrix.variant == 'before'
        run: cp "$RUNNER_TEMP/ThursdayJourneyScreenshotTest.kt" app/src/test/kotlin/com/fastingshift/app/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-runtime-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Run the fixed-clock app journey
        env:
          JAVA_TOOL_OPTIONS: -Drobolectric.dependency.repo.url=https://maven-central.storage-download.googleapis.com/maven2
        run: ./gradlew :app:testDebugUnitTest -Pscreenshots --tests '*.ThursdayJourneyScreenshotTest'
      - name: Report measured controls
        run: cat app/build/moats-captures/thursday/light-results.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thursday-journey-${{ matrix.variant }}
          path: app/build/moats-captures/thursday/
          if-no-files-found: warn
  gallery:
    name: Compare the same screens
    needs: compare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: thursday-journey-*
          path: evidence
      - name: Build the before-and-after gallery
        run: |
          python -c 'from PIL import Image' || python -m pip install Pillow
          python - <<'PYTHON'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageOps
          root = Path('evidence')
          output = root / 'comparison'
          output.mkdir()
          headings = ['Timer at 21:40', 'Date editor', 'After choosing 22:00', 'Updated plan']
          steps = ['02-timer', '03-date-editor', '04-picker-result', '05-saved']
          for mode in ['light', 'dark', 'compact-200pct']:
              for title, step in zip(headings, steps):
                  thumbs = []
                  for state in ['before', 'after']:
                      path = root / ('thursday-journey-' + state) / f'{mode}-{step}.png'
                      with Image.open(path) as screen:
                          thumbs.append(ImageOps.contain(screen.convert('RGB'), (440, 875)))
                  canvas = Image.new('RGB', (924, max(im.height for im in thumbs) + 100), '#f7f6f0')
                  draw = ImageDraw.Draw(canvas)
                  font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 22)
                  draw.text((14, 9), f'{title}  |  {mode}', font=font, fill='#142b25')
                  for i, (label, screen) in enumerate(zip(['Before', 'After'], thumbs)):
                      x = 14 + 456*i
                      draw.text((x, 43), label, font=font, fill='#40544c')
                      canvas.paste(screen, (x, 82))
                  canvas.save(output / f'{mode}-{step}.jpg', quality=91)
              for state in ['before', 'after']:
                  data = (root / ('thursday-journey-' + state) / f'{mode}-results.txt').read_text()
                  (output / f'{mode}-{state}.txt').write_text(data)
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: thursday-before-and-after
          path: evidence/comparison/
          if-no-files-found: error
