name: Inspect locked reminder on Android 15
on:
  push:
    branches: [codex/fasting-locked-delivery-qa]
permissions:
  contents: read

concurrency:
  group: locked-start-reminder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache/restore@v4
        id: staged
        with:
          path: app/build/outputs/apk/staging/app-staging.apk
          key: locked-check-staging-5372d1547f12d4d26ef175d5eaf554bae2e845d4
      - name: Build the installable staging app
        if: steps.staged.outputs.cache-hit != 'true'
        run: ./gradlew :app:assembleStaging
      - uses: actions/cache/save@v4
        if: steps.staged.outputs.cache-hit != 'true'
        with:
          path: app/build/outputs/apk/staging/app-staging.apk
          key: locked-check-staging-5372d1547f12d4d26ef175d5eaf554bae2e845d4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the UI driver and emulator
        run: |
          python -m pip install 'uiautomator2==3.3.2'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Move one start and observe delivery while PIN-locked
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python -u scripts/locked-start-reminder.py app/build/outputs/apk/staging/app-staging.apk
