name: Locked-screen start reminder
on:
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'scripts/beta-upgrade-smoke.py'
      - 'scripts/locked-start-reminder.py'
      - '.github/workflows/locked-start-reminder.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: locked-start-reminder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the installable staging app
        run: ./gradlew :app:assembleStaging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the UI driver and emulator
        run: |
          python -m pip install 'uiautomator2==3.3.2'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Move one start and observe delivery while PIN-locked
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python -u scripts/locked-start-reminder.py app/build/outputs/apk/staging/app-staging.apk
